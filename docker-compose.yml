services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: printing_cms
      POSTGRES_USER: printing
      POSTGRES_PASSWORD: printing
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printing -d printing_cms"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    environment:
      APP_ENV: production
      APP_PORT: 8080
      DATABASE_URL: postgres://printing:printing@postgres:5432/printing_cms?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-replace-this-with-a-long-production-secret}
      ACCESS_TOKEN_TTL_MINUTES: 15
      REFRESH_TOKEN_TTL_DAYS: 7
      FRONTEND_ORIGIN: http://localhost:3000
      COOKIE_SECURE: "false"
      UPLOAD_DIR: /app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  seed:
    build: ./backend
    command: ["/app/seed"]
    environment:
      DATABASE_URL: postgres://printing:printing@postgres:5432/printing_cms?sslmode=disable
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Super Admin}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@printku.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin123!change}
    depends_on:
      backend:
        condition: service_healthy
    profiles: ["tools"]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
        VITE_ASSET_URL: ""
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
  uploads:
